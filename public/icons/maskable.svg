<svg width="512" height="512" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed version of favicon.svg for phone home screens: the phone cuts its own shape
       (circle, squircle...), so the mark sits inside the middle 60% "safe zone". -->
  <defs>
    <linearGradient id="socialMaskableGradient" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>
  <rect width="40" height="40" fill="url(#socialMaskableGradient)"/>
  <g transform="translate(20 20) scale(0.72) translate(-20 -20)">
    <path d="M13 16.8C13 14.7 14.8 13 17 13H20.4C22.4 13 24 14.5 24 16.4C24 17.9 23 19.2 21.6 19.6C23.3 19.9 24.6 21.3 24.6 23.1C24.6 25.3 22.7 27 20.4 27H16.4C14.5 27 13 25.5 13 23.6" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="27.4" cy="14.2" r="2.2" fill="white"/>
  </g>
</svg>
