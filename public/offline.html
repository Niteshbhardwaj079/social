<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Offline | Social</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f5f6fa; color: #171a2b; text-align: center; }
      @media (prefers-color-scheme: dark) { body { background: #0f1120; color: #e8e9f1; } }
      img { width: 64px; height: 64px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { margin: 0 0 20px; opacity: 0.75; }
      button { font: inherit; font-weight: 600; padding: 10px 22px; border: 0; border-radius: 10px; background: #2563eb; color: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>You are offline</h1>
      <p>Check your internet connection. Your work is saved on the server.<br />आपका इंटरनेट बंद है — दोबारा जुड़ते ही यह पेज खुल जाएगा।</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener('online', () => location.reload());
      // A short network hiccup can land here while the device still says it is online: try again by itself.
      if (navigator.onLine) setTimeout(() => location.reload(), 5000);
    </script>
  </body>
</html>
